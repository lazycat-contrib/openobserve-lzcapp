params:
  - id: login_user
    type: string
    name: "Administrator Email"
    description: "Email address used as the OpenObserve administrator login"
    default_value: "root@example.com"
    optional: false

  - id: login_password
    type: secret
    name: "Administrator Password"
    description: "Password for the OpenObserve administrator; use a strong password"
    default_value: "$random(len=20)"
    optional: false

locales:
  zh:
    login_user:
      name: "管理员用户名（邮箱）"
      description: "用于登录 OpenObserve 的管理员邮箱地址"
    login_password:
      name: "管理员密码"
      description: "OpenObserve 管理员密码，请使用高强度密码"
